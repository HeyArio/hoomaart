<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>مدیریت هوما آرت</title>
<link rel="icon" href="/img/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<style>
body{background:var(--paper)}
.adm{max-width:1100px;margin:0 auto;padding:24px var(--gut) 80px}
.adm h1{font-size:2.4rem;margin-bottom:.4em}
.tabs{display:flex;gap:8px;margin:18px 0 24px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:6px 20px;border-radius:999px;border:1.5px solid var(--ink);background:none;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.card{background:#fff;border:1px solid var(--line);padding:16px 18px;margin-bottom:12px;display:grid;gap:6px}
.card header{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.card b{font-size:1.1rem}.card small{color:var(--mist)}
.tag{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--wall-2)}
.tag.new{background:var(--saffron)}
.card p{white-space:pre-wrap;max-width:none}
.card img.thumb{max-height:150px;width:auto;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row button,.row select,.row a{min-height:40px;padding:4px 14px;border:1.5px solid var(--line);background:#fff;border-radius:2px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.9rem}
.row .danger{color:var(--bad);border-color:var(--bad)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wgrid .card img{width:100%;aspect-ratio:3/2;object-fit:cover}
form.edit{grid-template-columns:1fr 1fr}
form.edit .wide{grid-column:1/-1}
@media(max-width:640px){form.edit{grid-template-columns:1fr}}
.empty{color:var(--mist);padding:30px 0}
@media print{body *{visibility:hidden}#labels,#labels *{visibility:visible}#labels{position:absolute;inset:0;display:grid!important;grid-template-columns:1fr 1fr;gap:10mm;padding:10mm}}
#labels{display:none}
.label{border:1px solid #999;padding:6mm;display:grid;grid-template-columns:32mm 1fr;gap:5mm;align-items:center;break-inside:avoid;font-family:var(--body)}
.label svg{width:32mm;height:32mm}.label b{font-family:var(--display);font-size:16pt;display:block;line-height:1.3}.label span{font-size:9pt;color:#444}
</style>
</head>
<body>
<div class="adm">
  <h1>مدیریت هوما آرت</h1>
  <form id="login" hidden>
    <label class="f"><span>رمز مدیریت</span><input type="password" name="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn primary" type="submit">ورود</button><p class="form-msg bad" id="loginMsg"></p>
  </form>
  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="subs" aria-selected="true">درخواست‌ها <span id="newCount"></span></button>
      <button role="tab" data-tab="works" aria-selected="false">آثار</button>
      <button id="logout" style="margin-inline-start:auto">خروج</button>
    </div>
    <section id="subs"></section>
    <section id="works" hidden>
      <div class="row" style="margin-bottom:16px"><button id="addWork" class="btn primary">افزودن اثر</button><button id="printLabels">چاپ نشانه‌های اسکن (QR)</button></div>
      <form class="edit" id="workForm" hidden>
        <label class="f"><span>عنوان (فارسی)</span><input name="title_fa" required></label>
        <label class="f"><span>Title (English)</span><input name="title_en" dir="ltr" required></label>
        <label class="f"><span>هنرمند (فارسی)</span><input name="artist_fa"></label>
        <label class="f"><span>Artist (English)</span><input name="artist_en" dir="ltr"></label>
        <label class="f"><span>تکنیک (فارسی)</span><input name="medium_fa"></label>
        <label class="f"><span>Medium (English)</span><input name="medium_en" dir="ltr"></label>
        <label class="f"><span>سال</span><input name="year" dir="ltr"></label>
        <label class="f"><span>قیمت (خالی = با درخواست)</span><input name="price_fa"></label>
        <label class="f"><span>عرض (سانتی‌متر)</span><input name="w" type="number" min="0" dir="ltr"></label>
        <label class="f"><span>ارتفاع (سانتی‌متر)</span><input name="h" type="number" min="0" dir="ltr"></label>
        <label class="f wide"><span>داستان اثر (فارسی)</span><textarea name="story_fa" rows="3"></textarea></label>
        <label class="f wide"><span>Story (English)</span><textarea name="story_en" rows="3" dir="ltr"></textarea></label>
        <label class="f"><span>عکس اثر</span><input name="image" type="file" accept="image/*"></label>
        <label class="f"><span>وضعیت</span><select name="available" style="min-height:48px"><option value="1">موجود</option><option value="0">فروخته‌شده</option></select></label>
        <div class="row wide"><button class="btn primary" type="submit">ذخیرهٔ اثر</button><button type="button" id="cancelWork">انصراف</button><span class="form-msg" id="workMsg"></span></div>
      </form>
      <div class="wgrid" id="workList"></div>
    </section>
  </div>
</div>
<div id="labels"></div>
<script src="/vendor/qrcode.js"></script>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);const esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});if(r.status===401&&u!=='/api/admin/login'){showLogin();throw new Error('auth')}return r};
const ROLE={artist:'هنرمند',space:'صاحب فضا',sponsor:'حامی',collector:'خریدار',viewing:'بازدید',other:'دیگر'};const ST={new:'تازه',contacted:'تماس گرفته شد',done:'بسته شد'};
let works=[],editing=null;
function showLogin(){$('#login').hidden=false;$('#app').hidden=true}
$('#login').addEventListener('submit',async(e)=>{e.preventDefault();const r=await api('POST','/api/admin/login',{password:e.target.password.value});
  if(r.ok){e.target.reset();boot()}else $('#loginMsg').textContent=r.status===429?'چند بار اشتباه وارد شد. یک ربع بعد دوباره امتحان کنید.':'رمز درست نیست.'});
$('#logout').addEventListener('click',async()=>{await api('POST','/api/admin/logout');showLogin()});
document.querySelectorAll('[data-tab]').forEach((b)=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach((x)=>x.setAttribute('aria-selected',x===b));$('#subs').hidden=b.dataset.tab!=='subs';$('#works').hidden=b.dataset.tab!=='works'}));
async function loadSubs(){const r=await api('GET','/api/admin/submissions');const a=await r.json();
  $('#newCount').textContent=a.filter((x)=>x.status==='new').length?`(${a.filter((x)=>x.status==='new').length})`:'';
  $('#subs').innerHTML=a.length?a.map((s)=>`<article class="card" data-id="${s.id}"><header><b>${esc(s.name)}</b><span class="row"><span class="tag ${s.status}">${ST[s.status]||s.status}</span><span class="tag">${ROLE[s.role]||s.role}</span><small dir="ltr">${new Date(s.at).toLocaleString('fa-IR')}</small></span></header>
   <div class="row">${s.phone?`<a dir="ltr" href="tel:${esc(s.phone)}">${esc(s.phone)}</a><a target="_blank" rel="noopener" href="https://wa.me/${esc(s.phone.replace(/\D/g,'').replace(/^0/,'98'))}">واتس‌اپ</a>`:''}${s.email?`<a dir="ltr" href="mailto:${esc(s.email)}">${esc(s.email)}</a>`:''}${s.link?`<span dir="ltr">${esc(s.link)}</span>`:''}${s.city?`<span>${esc(s.city)}</span>`:''}${s.work?`<a href="/w/${esc(s.work)}" target="_blank">اثر: ${esc(s.work)}</a>`:''}</div>
   ${s.message?`<p>${esc(s.message)}</p>`:''}${s.image?`<a href="${esc(s.image)}" target="_blank"><img class="thumb" src="${esc(s.image)}" alt=""></a>`:''}
   <div class="row"><select data-status>${Object.keys(ST).map((k)=>`<option value="${k}" ${k===s.status?'selected':''}>${ST[k]}</option>`).join('')}</select><button class="danger" data-del>حذف</button></div></article>`).join(''):'<p class="empty">هنوز درخواستی نرسیده است. هر فرمی که در سایت پر شود اینجا دیده می‌شود.</p>'}
$('#subs').addEventListener('change',async(e)=>{if(!e.target.matches('[data-status]'))return;await api('PUT','/api/admin/submissions/'+e.target.closest('[data-id]').dataset.id,{status:e.target.value});loadSubs()});
$('#subs').addEventListener('click',async(e)=>{if(!e.target.matches('[data-del]'))return;if(!confirm('این درخواست حذف شود؟'))return;await api('DELETE','/api/admin/submissions/'+e.target.closest('[data-id]').dataset.id);loadSubs()});
async function loadWorks(){works=await (await fetch('/api/works')).json();
  $('#workList').innerHTML=works.map((w)=>`<article class="card" data-id="${w.id}"><img src="${esc(w.img)}" alt=""><b>${esc(w.title.fa||w.title.en)}</b><small>${esc(w.artist.fa||'بدون نام هنرمند')}${w.w?` · ${w.w}×${w.h} cm`:''}</small><div class="row"><button data-edit>ویرایش</button><a href="/w/${w.id}" target="_blank">صفحه</a><button class="danger" data-delw>حذف</button></div></article>`).join('')||'<p class="empty">اثری ثبت نشده است.</p>'}
const wf=$('#workForm');
function openForm(w){editing=w?w.id:null;wf.hidden=false;wf.reset();$('#workMsg').textContent='';
  if(w){for(const k of['title','artist','medium','story'])for(const l of['fa','en'])if(wf[k+'_'+l])wf[k+'_'+l].value=w[k]?.[l]||'';wf.price_fa.value=w.price?.fa||'';wf.year.value=w.year||'';wf.w.value=w.w||'';wf.h.value=w.h||'';wf.available.value=w.available?'1':'0'}
  wf.scrollIntoView({behavior:'smooth'})}
$('#addWork').addEventListener('click',()=>openForm(null));$('#cancelWork').addEventListener('click',()=>{wf.hidden=true});
$('#workList').addEventListener('click',async(e)=>{const c=e.target.closest('[data-id]');if(!c)return;const w=works.find((x)=>x.id===c.dataset.id);
  if(e.target.matches('[data-edit]'))openForm(w);
  if(e.target.matches('[data-delw]')&&confirm(`«${w.title.fa||w.title.en}» حذف شود؟`)){await api('DELETE','/api/admin/works/'+w.id);loadWorks()}});
function readImage(file,max=2000){return new Promise((ok,bad)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok({data:c.toDataURL('image/jpeg',.88),ratio:c.width/c.height})};i.onerror=bad;i.src=u})}
wf.addEventListener('submit',async(e)=>{e.preventDefault();const two=(k)=>({fa:wf[k+'_fa'].value,en:wf[k+'_en']?wf[k+'_en'].value:''});
  const b={title:two('title'),artist:two('artist'),medium:two('medium'),story:two('story'),price:{fa:wf.price_fa.value,en:wf.price_fa.value},year:wf.year.value,w:+wf.w.value||0,h:+wf.h.value||0,available:wf.available.value==='1'};
  if(wf.image.files[0]){const im=await readImage(wf.image.files[0]);b.image=im.data;b.ratio=im.ratio}
  if(!editing&&!b.image){$('#workMsg').textContent='عکس اثر را انتخاب کنید.';return}
  $('#workMsg').textContent='در حال ذخیره…';const r=await api(editing?'PUT':'POST','/api/admin/works'+(editing?'/'+editing:''),b);
  if(r.ok){wf.hidden=true;loadWorks()}else $('#workMsg').textContent='ذخیره نشد. عکس کوچک‌تری انتخاب کنید و دوباره امتحان کنید.'});
$('#printLabels').addEventListener('click',()=>{$('#labels').innerHTML=works.map((w)=>{const q=qrcode(0,'M');q.addData(location.origin+'/w/'+w.id);q.make();return `<div class="label">${q.createSvgTag({scalable:true,margin:0})}<div><b>${esc(w.title.fa||w.title.en)}</b><span>${esc(w.artist.fa||'هوما آرت')}</span><br><span dir="ltr">hoomaart.ir/w/${w.id}</span></div></div>`}).join('');window.print()});
async function boot(){try{const r=await fetch('/api/admin/submissions');if(r.status===401)return showLogin();$('#login').hidden=true;$('#app').hidden=false;loadSubs();loadWorks()}catch{showLogin()}}
boot();
</script>
</body>
</html>
