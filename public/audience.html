<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هوما آرت | Hooma Art</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/img/mark.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/vazirmatn-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* One landing per audience. White wall, large works, one accent colour taken from a work. */
body{--ac:#111}
body[data-who=collectors]{--ac:#c1121f}
body[data-who=artists]{--ac:#1d3fb8}
body[data-who=investors]{--ac:#111113}
.wrap{max-width:1320px}
section{padding:clamp(56px,9vw,128px) 0}
h2{font-size:clamp(1.7rem,3.6vw,3rem);font-weight:800;max-width:20ch}
.ey{font-size:.875rem;font-weight:700;color:var(--ac);margin-bottom:12px}
.ld{font-size:clamp(1.05rem,1.4vw,1.3rem);color:var(--i2);margin-top:1rem;max-width:44ch;line-height:1.85}
html[lang=en] .ld{line-height:1.5}

/* hero: words on one side, a hung collage on the other */
.hero2{padding-top:clamp(104px,15vh,160px);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2.4vw,32px);row-gap:40px;align-items:center;max-width:1500px;margin-inline:auto;padding-inline:var(--gut)}
.hero2 .tx{grid-column:1/span 6}
.hero2 h1{font-size:clamp(2.2rem,min(5vw,9vh),4.6rem);font-weight:800;max-width:14ch}
.hero2 .actions{margin-top:1.8rem}
.col{grid-column:8/-1;position:relative;aspect-ratio:1/1.02}
.col img{position:absolute;object-fit:cover;border-radius:clamp(14px,1.6vw,24px);box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.col .a{inset:0 0 16% 14%;width:86%;height:84%}
.col .b{inset-inline-start:0;bottom:0;width:48%;aspect-ratio:1.45;border:6px solid #fff}
.col:before{content:"";position:absolute;inset-inline-end:-6%;top:-6%;width:44%;aspect-ratio:1;border-radius:50%;background:var(--ac);opacity:.12}
@media (max-width:900px){.hero2 .tx,.col{grid-column:1/-1}.col{order:-1;aspect-ratio:1.25}}

/* value */
.vals{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);margin-top:clamp(24px,4vw,56px)}
.val{grid-column:span 4;background:var(--tile);border-radius:clamp(18px,2vw,28px);padding:clamp(20px,2.4vw,36px);display:flex;flex-direction:column;min-height:clamp(170px,22vw,260px)}
.val:first-child{grid-column:span 8;background:var(--ac);color:#fff}
.val:nth-child(4){grid-column:span 8}
.val b{font-weight:800;font-size:clamp(1.25rem,2.1vw,1.9rem);line-height:1.4;margin-top:auto}
.val:first-child b{font-size:clamp(1.6rem,3.2vw,2.8rem);line-height:1.3;max-width:18ch}
.val p{font-size:.9688rem;color:var(--i2);margin-top:8px;max-width:46ch}
.val:first-child p{color:rgba(255,255,255,.86)}
.val i{font-style:normal;font-weight:700;font-size:.875rem;color:var(--ac)}
.val:first-child i{color:#fff;opacity:.8}
@media (max-width:860px){.val,.val:first-child,.val:nth-child(4){grid-column:1/-1;min-height:0}.val b{margin-top:18px}}

/* journey */
.jr{background:var(--tile)}
.path2{list-style:none;padding:0;margin-top:clamp(28px,4vw,56px);display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:clamp(12px,1.6vw,24px);row-gap:28px;position:relative}
.path2:before{content:"";position:absolute;top:17px;inset-inline:17px;height:2px;background:var(--rule)}
.path2 li{position:relative}
.path2 li>span{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ac);font-weight:800;font-size:.875rem;color:var(--ac)}
.path2 li:first-child>span{background:var(--ac);color:#fff}
.path2 h3{font-size:1.0625rem;margin-top:16px}
.path2 p{font-size:.875rem;color:var(--i2);margin-top:4px}
.path2 a{display:inline-block;margin-top:8px;font-size:.875rem;font-weight:600;color:var(--ac)}
@media (max-width:900px){.path2{grid-template-columns:1fr}.path2:before{top:17px;bottom:17px;inset-inline:17px auto;width:2px;height:auto}.path2 li{padding-inline-start:54px}.path2 li>span{position:absolute;inset-inline-start:0;top:0}.path2 h3{margin-top:4px}}

/* extra blocks */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);margin-top:clamp(24px,4vw,48px)}
.strip a{display:block;text-decoration:none;color:inherit}
.strip img{width:100%;aspect-ratio:1.4;object-fit:cover;border-radius:clamp(12px,1.4vw,20px);transition:transform .8s var(--out)}
.strip a:hover img{transform:scale(1.03)}
.strip b{display:block;font-weight:700;margin-top:10px}
.strip span{font-size:.8125rem;color:var(--i2)}
@media (max-width:760px){.strip{grid-template-columns:1fr 1fr}}
.list2{list-style:none;padding:0;margin-top:clamp(20px,3vw,40px);display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(16px,2.4vw,32px);border-top:1px solid var(--rule)}
.list2 li{padding:16px 0;border-bottom:1px solid var(--rule);font-size:1rem;font-weight:500}
@media (max-width:760px){.list2{grid-template-columns:1fr}}
.figs{display:grid;grid-template-columns:2fr 1fr 1fr;gap:clamp(10px,1.2vw,18px);margin-top:clamp(24px,4vw,48px)}
.figs>div{background:var(--tile);border-radius:clamp(18px,2vw,28px);padding:clamp(20px,2.4vw,36px)}
.figs>div:first-child{background:#111;color:#fff}
.figs .n{font-weight:800;font-size:clamp(2.4rem,6vw,5.5rem);line-height:1.1}
.figs .n.s{font-size:clamp(1.9rem,3.6vw,3.2rem)}
.figs p{font-size:.9375rem;color:var(--i2);margin-top:4px}
.figs>div:first-child p{color:#c7c7cc}
@media (max-width:760px){.figs{grid-template-columns:1fr}}
.fine{font-size:.8125rem;color:var(--i2);margin-top:16px;max-width:80ch}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);margin-top:clamp(24px,4vw,48px)}
.status>div{border:1px solid var(--rule);border-radius:clamp(16px,1.8vw,24px);padding:clamp(16px,2vw,26px)}
.status em{font-style:normal;display:inline-flex;align-items:center;gap:7px;font-size:.75rem;font-weight:700;color:var(--i2);margin-bottom:12px}
.status em.on{color:var(--i)}.status em.on:before{content:"";width:7px;height:7px;border-radius:50%;background:#30a14e}
.status b{font-weight:700;display:block}
@media (max-width:760px){.status{grid-template-columns:1fr}}

/* closing */
.close2{text-align:center;padding-bottom:clamp(40px,6vw,72px)}
.close2 h2{margin-inline:auto}
.close2 .actions{justify-content:center}
.who{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;margin-top:clamp(36px,6vw,72px);padding-top:22px;border-top:1px solid var(--rule);font-size:.875rem;color:var(--i2)}
.who a{color:var(--i)}
.up{opacity:0;transform:translateY(24px)}
.up.in{opacity:1;transform:none;transition:opacity .9s var(--out),transform 1.1s var(--out)}
@media (prefers-reduced-motion:reduce){.up{opacity:1;transform:none}}
</style>
</head>

        steps: [['Sponsor', 'Pays the hosting cost of one evening.'], ['Space', 'The owner hosts for one evening.'], ['Works', 'Artists consign their works.'], ['Guests', 'About fifty, by name.'], ['Sale', 'In person. Hooma Art takes a share.']],
        xh: 'Sponsorship of the first event', figs: [['750', 'million toman, the full hosting cost paid by the lead sponsor'], ['50', 'guests, each invited by name'], ['15', 'million toman, about the cost per guest']],
        fine: 'The sponsor is not an investor and receives no profit share. Hooma Art\'s share of each sale is agreed with the artist. Later revenue (memberships, promoted placement, tools for galleries and space owners) is not yet decided.',
        sh: 'Where we are today', status: [[1, 'Working', 'The platform at hoomaart.ir'], [1, 'On the site', 'First collection: seven photographs'], [0, 'Next', 'Signing the first artists'], [0, 'In preparation', 'The first event, with a sponsor'], [0, 'The first event will test', 'Whether the buyer network turns up and buys'], [0, 'After the first event', 'Recurring revenue']],
        ch: 'Let\'s cover the rest in person.', cc: [['Talk on WhatsApp', WA], ['Full platform walkthrough', '/overview']] },
    },
  };
  const who = (location.pathname.split('/')[2] || '').replace(/[^a-z]/g, '');
  if (!P[who]) { location.replace('/'); return; }
  document.body.dataset.who = who;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (n, l) => (l === 'fa' ? String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(n));
  const btns = (a) => a.map(([t, h], i) => '<a class="btn' + (i ? '' : ' primary') + '" href="' + h + '"' + (h.startsWith('http') ? ' target="_blank" rel="noopener"' : '') + '>' + esc(t) + '</a>').join('');
  const OTHER = { fa: { collectors: 'مجموعه‌دار هستم', artists: 'هنرمند هستم', investors: 'سرمایه‌گذار هستم', sw: 'کس دیگری هستید؟', v: 'ارزش', p: 'مسیر' }, en: { collectors: 'I\'m a collector', artists: 'I\'m an artist', investors: 'I\'m an investor', sw: 'Someone else?', v: 'Value', p: 'Path' } };
  let works = [];

  function render(l) {
    const d = P[who], t = d[l], o = OTHER[l];
    document.title = (l === 'fa' ? 'هوما آرت | ' : 'Hooma Art | ') + t.who;
    document.querySelector('[data-k=navValue]').textContent = o.v; document.querySelector('[data-k=navPath]').textContent = o.p;
    let x = '';
    if (who === 'collectors') x = '<section><div class="wrap"><h2>' + esc(t.xh) + '</h2><p class="ld">' + esc(t.xl) + '</p><div class="strip">' + works.slice(0, 4).map((w) => '<a href="/w/' + w.id + '"><img loading="lazy" src="' + w.img + '" alt=""><b>' + esc(w.title[l] || w.title.fa) + '</b><span>' + esc((w.medium && (w.medium[l] || w.medium.fa)) || '') + '</span></a>').join('') + '</div><div class="actions"><a class="btn" href="/gallery#collection">' + esc(t.cta[0][0]) + '</a></div></div></section>';
    if (who === 'artists') x = '<section><div class="wrap"><h2>' + esc(t.xh) + '</h2><ul class="list2">' + t.list.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul></div></section>';
    if (who === 'investors') x = '<section><div class="wrap"><h2>' + esc(t.xh) + '</h2><div class="figs">' + t.figs.map(([n, p], i) => '<div class="up"><div class="n' + (i ? ' s' : '') + '">' + esc(n) + '</div><p>' + esc(p) + '</p></div>').join('') + '</div><p class="fine">' + esc(t.fine) + '</p></div></section>' +
      '<section class="jr"><div class="wrap"><h2>' + esc(t.sh) + '</h2><div class="status">' + t.status.map(([on, a, b]) => '<div class="up" style="background:#fff"><em' + (on ? ' class="on"' : '') + '>' + esc(a) + '</em><b>' + esc(b) + '</b></div>').join('') + '</div></div></section>';
    document.getElementById('page').innerHTML =
      '<div class="hero2"><div class="tx rise"><p class="ey">' + esc(t.who) + '</p><h1>' + esc(t.h1) + '</h1><p class="ld">' + esc(t.ld) + '</p><div class="actions">' + btns(t.cta) + '</div></div><div class="col"><img class="a" src="' + d.img[0] + '" alt=""><img class="b" src="' + d.img[1] + '" alt=""></div></div>' +
      '<section id="value"><div class="wrap"><h2>' + esc(t.vh) + '</h2><div class="vals">' + t.vals.map(([k, b, p]) => '<div class="val up"><i>' + esc(k) + '</i><b>' + esc(b) + '</b><p>' + esc(p) + '</p></div>').join('') + '</div></div></section>' +
      '<section class="jr" id="journey"><div class="wrap"><h2>' + esc(t.jh) + '</h2><ol class="path2" style="--n:' + t.steps.length + '">' + t.steps.map(([h, p, lt, lh], i) => '<li class="up"><span>' + num(i + 1, l) + '</span><h3>' + esc(h) + '</h3><p>' + esc(p) + '</p>' + (lt ? '<a href="' + lh + '">' + esc(lt) + '</a>' : '') + '</li>').join('') + '</ol></div></section>' +
      x +
      '<section class="close2"><div class="wrap"><h2>' + esc(t.ch) + '</h2><div class="actions">' + btns(t.cc) + '</div><p class="who"><span>' + esc(o.sw) + '</span>' + Object.keys(P).filter((k) => k !== who).map((k) => '<a href="/for/' + k + '">' + esc(o[k]) + '</a>').join('') + '<a href="/">' + (l === 'fa' ? 'صفحهٔ نخست' : 'Home') + '</a></p></div></section>';
    reveal();
  }
  function reveal() {
    const els = [...document.querySelectorAll('.up')];
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return els.forEach((e) => e.classList.add('in'));
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' });
    els.forEach((e) => { if (e.getBoundingClientRect().top < innerHeight) e.classList.add('in'); else io.observe(e); });
  }
  HoomaLite.onLang(render);
  if (who === 'collectors') fetch('/api/works').then((r) => r.json()).then((w) => { works = Array.isArray(w) ? w : []; render(HoomaLite.lang); }).catch(() => {});
})();
</script>
